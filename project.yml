# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: ReadKeeper

options:
  bundleIdPrefix: com.vurimad
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  ReadKeeper:
    type: application
    platform: iOS
    sources:
      - path: ReadKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vurimad.readkeeper
        PRODUCT_NAME: ReadKeeper
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ReadKeeper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ReadKeeperTests
      gatherCoverageData: true

  ReadKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReadKeeperTests
    dependencies:
      - target: ReadKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vurimad.readkeeper.tests
        GENERATE_INFOPLIST_FILE: YES
